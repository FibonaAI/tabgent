<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>$i18n{newChat}</title>
    <link rel="stylesheet" href="../vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body class="empty" style="visibility: hidden">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        ><input id="title" aria-label="$i18n{titleLabel}" value="$i18n{newChat}" maxlength="100" />
      </div>
      <div class="conversation-actions">
        <button
          id="openAgent"
          hidden
          class="icon-button"
          title="$i18n{openAgentTab}"
          aria-label="$i18n{openAgentTab}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M14 4h6v6m0-6-9 9M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" />
          </svg>
        </button>
        <button
          class="icon-button"
          id="newConversation"
          title="$i18n{newAgentConversation}"
          aria-label="$i18n{newAgentConversation}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>
      <div class="connection">
        <span id="connection">$i18n{connecting}</span
        ><button id="reconnect" hidden>$i18n{reconnect}</button>
      </div>
    </header>
    <main id="scroll">
      <section id="setup" hidden aria-labelledby="setupTitle">
        <h2 id="setupTitle"></h2>
        <p id="setupHint"></p>
        <div class="setup-actions">
          <button id="setupPrimary"></button><button id="setupCheck">$i18n{setupCheck}</button
          ><button id="setupCancel" hidden>$i18n{setupCancel}</button>
        </div>
        <p id="setupStatus" role="status" hidden></p>
        <p id="setupError" role="alert" hidden></p>
      </section>
      <section id="messages" aria-label="$i18n{messagesLabel}"></section>
    </main>
    <footer>
      <button id="jump" aria-label="$i18n{jumpLatest}" hidden>↓</button>
      <div id="questions"></div>
      <details id="goal" hidden></details>
      <div id="commandMenu" hidden></div>
      <section id="followups" aria-label="$i18n{queuedMessages}" hidden></section>
      <div class="composer">
        <div id="selection" hidden>
          <button id="selectionText" type="button" aria-expanded="false"></button
          ><button
            id="selectionRemove"
            aria-label="$i18n{selectionRemove}"
            title="$i18n{selectionRemove}"
            type="button"
          >
            ×
          </button>
        </div>
        <div id="attachments" hidden></div>
        <div id="skillChips" hidden></div>
        <div id="planMode" hidden>$i18n{planMode}</div>
        <input id="attachmentFiles" type="file" multiple hidden /><textarea
          id="prompt"
          aria-label="$i18n{promptLabel}"
          placeholder="$i18n{promptPlaceholder}"
          rows="1"
          aria-autocomplete="list"
          aria-controls="commandOptions"
          aria-expanded="false"
        ></textarea>
        <span id="stopConfirmation" role="status" hidden>$i18n{confirmStop}</span>
        <div class="composer-bottom">
          <div class="settings">
            <button
              id="attach"
              type="button"
              title="$i18n{attachFiles}"
              aria-label="$i18n{attachFiles}"
            >
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path
                  d="M10 4v12M4 10h12"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg></button
            ><select id="model" aria-label="$i18n{modelLabel}">
              <option value="">$i18n{defaultModel}</option></select
            ><select id="effort" aria-label="$i18n{effortLabel}">
              <option value="medium">$i18n{effortMedium}</option></select
            ><span class="settings-separator"></span
            ><select id="scope" aria-label="$i18n{scopeLabel}" title="$i18n{scopeHint}">
              <option value="window">$i18n{scopeWindow}</option>
              <option value="browser">$i18n{scopeBrowser}</option></select
            ><button
              id="context"
              type="button"
              popovertarget="contextDetails"
              aria-label="$i18n{pageContext}"
              hidden
            >
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect
                  x="3"
                  y="4"
                  width="14"
                  height="12"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <path d="M3 8h14" stroke="currentColor" stroke-width="1.4" /></svg
              ><span id="contextText"></span>
            </button>
          </div>
          <button
            id="send"
            class="send"
            aria-label="$i18n{sendLabel}"
            title="$i18n{sendHint}"
            disabled
          >
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M10 15V5m-4 4 4-4 4 4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg></button
          ><button
            id="stop"
            class="send"
            aria-label="$i18n{stopLabel}"
            title="$i18n{stopLabel}"
            hidden
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
      <div class="bottom">
        <span id="keyboardHint">$i18n{keyboardHint}</span><span id="contextUsage" hidden></span>
      </div>
    </footer>
    <dialog id="commandDialog" aria-label="$i18n{commands}"></dialog>
    <div id="contextDetails" popover>
      <div id="contextFullTitle"></div>
      <div id="contextFullUrl"></div>
    </div>
    <dialog id="imagePreview" aria-label="$i18n{imagePreview}">
      <button
        id="imagePreviewClose"
        type="button"
        aria-label="$i18n{closePreview}"
        title="$i18n{closePreview}"
      >
        ×
      </button>
      <div id="imagePreviewViewport">
        <img
          id="imagePreviewOriginal"
          alt=""
          tabindex="0"
          role="button"
          aria-label="$i18n{imageZoom}"
          aria-pressed="false"
        />
      </div>
    </dialog>
    <script type="module" src="chat.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>$i18n{newChat}</title>
    <link rel="stylesheet" href="../vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body class="empty" style="visibility: hidden">
    <aside id="historyPanel" hidden aria-label="$i18n{pageHistory}">
      <div class="history-heading">
        <strong>$i18n{pageHistory}</strong
        ><button
          id="historyClose"
          class="icon-button"
          aria-label="$i18n{closeHistory}"
          title="$i18n{closeHistory}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="M9 4v16M16 9l-3 3 3 3" />
          </svg>
        </button>
      </div>
      <button id="historyUrl" type="button" popovertarget="historyUrlDetails"></button>
      <div id="historyList"></div>
    </aside>
    <header>
      <button
        id="historyToggle"
        class="icon-button"
        aria-label="$i18n{pageHistory}"
        title="$i18n{pageHistory}"
        aria-expanded="false"
        aria-controls="historyPanel"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </svg>
      </button>
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M8 6 3.1 10.9Q2 12 3.1 13.1L8 18M16 6l4.9 4.9q1.1 1.1 0 2.2L16 18M13 3l-2 18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        ><input id="title" aria-label="$i18n{titleLabel}" value="$i18n{newChat}" maxlength="100" />
      </div>
      <div class="conversation-actions">
        <button
          id="openAgent"
          hidden
          class="icon-button"
          title="$i18n{openAgentTab}"
          aria-label="$i18n{openAgentTab}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5V10M19.5 4.5 11 13M10 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
          </svg>
        </button>
        <button
          class="icon-button"
          id="newConversation"
          disabled
          title="$i18n{newAgentConversation}"
          aria-label="$i18n{newAgentConversation}"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>
      <div class="connection">
        <span id="connection">$i18n{connecting}</span
        ><button id="reconnect" hidden>$i18n{reconnect}</button>
      </div>
    </header>
    <main id="scroll">
      <section id="setup" hidden aria-labelledby="setupTitle">
        <h2 id="setupTitle"></h2>
        <p id="setupHint"></p>
        <div class="setup-actions">
          <button id="setupPrimary"></button><button id="setupCheck">$i18n{setupCheck}</button
          ><button id="setupCancel" hidden>$i18n{setupCancel}</button>
        </div>
        <p id="setupStatus" role="status" hidden></p>
        <p id="setupError" role="alert" hidden></p>
      </section>
      <section id="messages" aria-label="$i18n{messagesLabel}"></section>
    </main>
    <div id="modelMenu" class="composer-menu" popover>
      <button id="modelMenuHeader">
        <span id="selectedModel"></span><span id="selectedEffort"></span
        ><span aria-hidden="true">›</span>
      </button>
      <div id="effortControl">
        <input
          id="effortRange"
          type="range"
          min="0"
          max="1"
          step="1"
          aria-label="$i18n{effortLabel}"
        />
        <div id="effortTicks" aria-hidden="true"></div>
      </div>
      <div id="modelOptions" hidden role="menu" aria-label="$i18n{modelLabel}"></div>
    </div>
    <div id="permissionMenu" class="composer-menu" popover>
      <p>$i18n{permissionQuestion}</p>
      <div id="permissionOptions" role="menu" aria-label="$i18n{permissions}"></div>
    </div>
    <div id="scopeMenu" class="composer-menu" popover>
      <p>$i18n{scopeQuestion}</p>
      <div id="scopeOptions" role="menu" aria-label="$i18n{scopeLabel}"></div>
    </div>
    <footer>
      <button id="jump" aria-label="$i18n{jumpLatest}" hidden>↓</button>
      <div id="questions"></div>
      <details id="goal" hidden></details>
      <div id="commandMenu" hidden></div>
      <section id="followups" aria-label="$i18n{queuedMessages}" hidden></section>
      <div class="composer">
        <div id="selection" hidden>
          <button id="selectionText" type="button" aria-expanded="false"></button
          ><button
            id="selectionRemove"
            aria-label="$i18n{selectionRemove}"
            title="$i18n{selectionRemove}"
            type="button"
          >
            ×
          </button>
        </div>
        <div id="attachments" hidden></div>
        <div id="skillChips" hidden></div>
        <div id="planMode" hidden>$i18n{planMode}</div>
        <input id="attachmentFiles" type="file" multiple hidden /><textarea
          id="prompt"
          aria-label="$i18n{promptLabel}"
          placeholder="$i18n{promptPlaceholder}"
          rows="1"
          aria-autocomplete="list"
          aria-controls="commandOptions"
          aria-expanded="false"
        ></textarea>
        <span id="stopConfirmation" role="status" hidden>$i18n{confirmStop}</span>
        <div class="composer-bottom">
          <div class="settings">
            <button
              id="attach"
              type="button"
              title="$i18n{attachFiles}"
              aria-label="$i18n{attachFiles}"
            >
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path
                  d="M10 4v12M4 10h12"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg></button
            ><select hidden id="model" aria-label="$i18n{modelLabel}">
              <option value="">$i18n{defaultModel}</option></select
            ><select hidden id="effort" aria-label="$i18n{effortLabel}">
              <option value="medium">$i18n{effortMedium}</option></select
            ><button
              id="permissionButton"
              popovertarget="permissionMenu"
              aria-label="$i18n{permissions}"
            >
              <svg
                viewBox="0 0 20 20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m10 2 6 3v5c0 4-6 7-6 7s-6-3-6-7V5z" />
                <path d="M10 6v4m0 3h.01" /></svg
              ><span id="permissionLabel"></span></button
            ><button id="modelButton" popovertarget="modelMenu" aria-label="$i18n{modelLabel}">
              <span id="modelLabel"></span><span id="effortLabel"></span></button
            ><span class="settings-separator"></span
            ><select hidden id="scope" aria-label="$i18n{scopeLabel}" title="$i18n{scopeHint}">
              <option value="window">$i18n{scopeWindow}</option>
              <option value="browser">$i18n{scopeBrowser}</option></select
            ><button
              id="scopeButton"
              popovertarget="scopeMenu"
              aria-label="$i18n{scopeLabel}"
              title="$i18n{scopeHint}"
            >
              <span id="scopeButtonLabel"></span></button
            ><button
              id="context"
              type="button"
              popovertarget="contextDetails"
              aria-label="$i18n{pageContext}"
              hidden
            >
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <rect
                  x="3"
                  y="4"
                  width="14"
                  height="12"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <path d="M3 8h14" stroke="currentColor" stroke-width="1.4" /></svg
              ><span id="contextText"></span>
            </button>
          </div>
          <button
            id="send"
            class="send"
            aria-label="$i18n{sendLabel}"
            title="$i18n{sendHint}"
            disabled
          >
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M10 15V5m-4 4 4-4 4 4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg></button
          ><button
            id="stop"
            class="send"
            aria-label="$i18n{stopLabel}"
            title="$i18n{stopLabel}"
            hidden
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
      <div class="bottom">
        <span id="keyboardHint">$i18n{keyboardHint}</span><span id="contextUsage" hidden></span>
      </div>
    </footer>
    <dialog id="commandDialog" aria-label="$i18n{commands}"></dialog>
    <div id="historyUrlDetails" popover></div>
    <div id="contextDetails" popover>
      <div id="contextFullTitle"></div>
      <div id="contextFullUrl"></div>
    </div>
    <dialog id="imagePreview" aria-label="$i18n{imagePreview}">
      <button
        id="imagePreviewClose"
        type="button"
        aria-label="$i18n{closePreview}"
        title="$i18n{closePreview}"
      >
        ×
      </button>
      <div id="imagePreviewViewport">
        <img
          id="imagePreviewOriginal"
          alt=""
          tabindex="0"
          role="button"
          aria-label="$i18n{imageZoom}"
          aria-pressed="false"
        />
      </div>
    </dialog>
    <script type="module" src="chat.js"></script>
  </body>
</html>
